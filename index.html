<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VR Furniture Shop</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body { margin: 0; }
  </style>

  <script>
    // Component to handle furniture switching
    AFRAME.registerComponent('show-furniture', {
      schema: {
        message: { type: 'string' },
        model: { type: 'selector' }
      },

      init: function () {
        this.el.addEventListener('click', () => {

          // Update title text
          document.querySelector('#infoText')
            .setAttribute('value', this.data.message.toUpperCase());

          // Hide all furniture models ✅ FIXED
          document.querySelectorAll('.furniture-model')
            .forEach(m => m.setAttribute('visible', false));

          // Show selected model
          if (this.data.model) {
            this.data.model.setAttribute('visible', true);
          }
        });
      }
    });
  </script>
</head>

<body>

<a-scene background="color: #87CEEB">

  <!-- Camera -->
  <a-entity position="0 0 4" wasd-controls>
    <a-entity camera look-controls position="0 1.6 0">
      <a-cursor raycaster="objects: .clickable; far: 20" color="#FFD700"></a-cursor>
    </a-entity>
  </a-entity>

  <!-- Lighting -->
  <a-light type="ambient" intensity="0.7"></a-light>
  <a-light type="directional" position="1 5 2" intensity="0.8"></a-light>

  <!-- Floor -->
  <a-plane position="0 -1 0" rotation="-90 0 0"
           width="15" height="15" color="#228B22"></a-plane> 
  
  <!-- Carpet -->
  <a-plane position="0 -0.99 0" rotation="-90 0 0"
           width="3" height="10" color="#C2B280"></a-plane> 

  <!-- Walls -->
  <a-plane position="0 2 -6" width="12" height="6" color="#FFFFFF"></a-plane> 
  <a-plane position="-6 2 0" rotation="0 90 0" width="12" height="6" color="#F0F0F0"></a-plane>
  <a-plane position="6 2 0" rotation="0 -90 0" width="12" height="6" color="#F0F0F0"></a-plane>

  <!-- Title -->
  <a-text id="infoText"
          value="FURNITURES"
          position="0 4.5 -5.8"
          align="center"
          width="10"
          color="#1D3557">
  </a-text>

  <!-- 3D MODELS -->

  

  <!-- Chair -->
  <a-entity id="chair3D" class="furniture-model"
            gltf-model="url(chair.glb)"
            position="0 0 1"
            scale="1.2 1.2 1.2"
            visible="false"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000">
  </a-entity>

  <!-- Sofa -->
  <a-entity id="sofa3D" class="furniture-model"
            gltf-model="url(modern_sofa.glb)"
            position="0 1 2.5"
            scale="0.5 0.5 0.5"
            visible="false"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000">
  </a-entity>

  <!-- CLICKABLE IMAGE PANELS -->

  

  <!-- Chair -->
  <a-plane class="clickable"
           src="chair.jpg"
           position="0 1.8 -5.9"
           width="1.8" height="2.2"
           show-furniture="message: Chair; model: #chair3D">
  </a-plane>

  <!-- Sofa -->
  <a-plane class="clickable"
           src="sofa.jpg"
           position="3 1.8 -5.9"
           width="1.8" height="2.2"
           show-furniture="message: Sofa; model: #sofa3D">
  </a-plane>

</a-scene>

</body>
</html>
