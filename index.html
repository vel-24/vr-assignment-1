<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VR Furniture Showroom</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body { margin: 0; }
  </style>

  <script>
    AFRAME.registerComponent('show-item', {
      schema: {
        message: { type: 'string' },
        model: { type: 'string' }   // ✅ FIXED
      },

      init: function () {
        this.el.addEventListener('click', () => {

          // Update title text
          document.querySelector('#infoText')
            .setAttribute('value', this.data.message);

          // Hide all models
          document.querySelectorAll('.furniture-model')
            .forEach(m => m.setAttribute('visible', false));

          // Show selected model (FIXED LOGIC)
          const selectedModel = document.querySelector(this.data.model);

          if (selectedModel) {
            selectedModel.setAttribute('visible', true);
          }
        });
      }
    });
  </script>
</head>

<body>

<a-scene background="color: #ECECEC">

  <!-- Camera -->
  <a-entity position="0 0 4" wasd-controls>
    <a-entity camera look-controls position="0 1.6 0">
      <a-cursor raycaster="objects: .clickable" color="#000"></a-cursor>
    </a-entity>
  </a-entity>

  <!-- Lights -->
  <a-light type="ambient" intensity="0.8"></a-light>
  <a-light type="directional" position="2 5 3" intensity="0.6"></a-light>

  <!-- Floor -->
  <a-plane position="0 -1 0" rotation="-90 0 0"
           width="15" height="15" color="#DCDCDC"></a-plane>

  <!-- Walls -->
  <a-plane position="0 2 -6" width="12" height="6" color="#FFFFFF"></a-plane>
  <a-plane position="-6 2 0" rotation="0 90 0" width="12" height="6" color="#F5F5F5"></a-plane>
  <a-plane position="6 2 0" rotation="0 -90 0" width="12" height="6" color="#F5F5F5"></a-plane>

  <!-- Title -->
  <a-text id="infoText"
          value="FURNITURE SHOWROOM"
          position="0 4.5 -5.8"
          align="center"
          width="10"
          color="#333">
  </a-text>

  <!-- ================== 3D MODELS ================== -->

  <!-- Table -->
  <a-entity id="table3D" class="furniture-model"
            gltf-model="url(hexagonal_table_01.glb)"
            position="0 0 2"
            scale="1 1 1"
            visible="false"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
  </a-entity>

  <!-- Chair -->
  <a-entity id="chair3D" class="furniture-model"
            gltf-model="url(chair.glb)"
            position="0 0 2"
            scale="1 1 1"
            visible="false"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000">
  </a-entity>

  <!-- Sofa -->
  <a-entity id="sofa3D" class="furniture-model"
            gltf-model="url(modern_sofa.glb)"
            position="0 0 2"
            scale="1 1 1"
            visible="false"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 12000">
  </a-entity>

  <!-- ================== CLICK PANELS ================== -->

  <!-- Table -->
  <a-plane class="clickable"
           src="table.jpg"
           position="-3 1.8 -5.9"
           width="2" height="2"
           show-item="message: Wooden Table; model: #table3D">
  </a-plane>

  <!-- Chair -->
  <a-plane class="clickable"
           src="chair.jpg"
           position="0 1.8 -5.9"
           width="2" height="2"
           show-item="message: Comfortable Chair; model: #chair3D">
  </a-plane>

  <!-- Sofa -->
  <a-plane class="clickable"
           src="sofa.jpg"
           position="3 1.8 -5.9"
           width="2" height="2"
           show-item="message: Modern Sofa; model: #sofa3D">
  </a-plane>

</a-scene>

</body>
</html>
